name: Feature request
description: Ask for something Toolbox does not do yet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. Search the [issues](https://github.com/arvarik/toolbox/issues?q=is%3Aissue) and the [ideas](https://github.com/arvarik/toolbox/discussions/categories/ideas) first. A rough idea that needs talk can start in Discussions.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you try to do, and what stops you today?
      placeholder: When reviewing due cards across multiple Kits, I want to filter by prerequisite node or pillar.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How Toolbox could solve it. A sketch or an example from another app helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Study Library and Shared Kits
        - Kit Compiler and Living Kits
        - FSRS-6 Flashcards and Daily Review
        - Guided Drills and Feynman Evaluator
        - Knowledge Graph and Canvas
        - Guide and AI Tutor Chat
        - Import, Backup and Export (.json / .zip)
        - AI Routing, BYOK and Hybrid Search
        - Accounts, SSO and Administration
        - MCP Server and REST API
        - Docker and Self-Hosting
        - Other
    validations:
      required: true
