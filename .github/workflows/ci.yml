name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint · Typecheck · Audit · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, Typecheck & Tenant Isolation Check
        run: npm run lint

      - name: Dependency Security Audit
        run: npm audit --omit=dev

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
