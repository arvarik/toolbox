# Fork-PR-safe CodeQL code scanning (`build-mode: none`).
# Never change the trigger to `pull_request_target`.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          upload: failure-only

      # safeFetch in server/platform/net/originAndFetch.ts is the SSRF guard. It checks the
      # address of every connection and every redirect. js/request-forgery cannot see that
      # check, so it reports each user-set URL that reaches the guard. This step drops only
      # those results. The query still runs, and it still reports a request outside safeFetch.
      - name: Drop request-forgery results inside the SSRF guard
        run: |
          for f in sarif-results/*.sarif; do
            jq '.runs |= map(.results |= map(select(.ruleId != "js/request-forgery" or .locations[0].physicalLocation.artifactLocation.uri != "server/platform/net/originAndFetch.ts")))' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Upload results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif-results
          category: /language:${{ matrix.language }}
