# Dependabot opens update pull requests each Monday. GitHub reads this file
# from the default branch, so it takes effect when it reaches `main`.
#
# `cooldown` waits a week after a release before proposing it. A hijacked
# package version is usually found and pulled within days, so the wait keeps
# most of them out of this repository.
#
# A security update ignores the cooldown and the schedule. The "Dependabot
# security updates" setting turns them on, and the `npm-security` group below
# puts every npm security update in one pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # One pull request for every minor and patch update of a dev tool, and
      # one for the app's own dependencies. A major update gets its own.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      # One pull request for all npm security updates, not one per package.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # Keep workflow actions up to date weekly.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Keep the Dockerfile base image up to date weekly within the pinned LTS major.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
